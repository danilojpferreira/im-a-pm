<title>Business map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a three-pane workbench (flow index · canvas · inspector) that stacks to one column on phones. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #1b2628;
  --muted: #5b686a;
  --line: #d5dbd6;
  --accent: #1f6a72;
  --accent-soft: #dcecec;

  --decision-bg: #fbf0d6; --decision-line: #b98a22;
  --action-bg: #eef1f8;   --action-line: #6a7aa6;
  --data-bg: #e3f0f6;     --data-line: #3c84a6;
  --external-bg: #f1e9f6; --external-line: #8a64a8;
  --start-bg: #1b2628;    --start-ink: #f3f5f2;
  --loop: #9a3384;        --implicit-stripe: rgba(185, 87, 58, 0.10);
  --focus: #2459c9;
  --ok-bg: #e2f2e4;       --ok-line: #3a8a4c;
  --rej-bg: #fbe6df;      --rej-line: #b9573a;
  --err-bg: #eceeee;      --err-line: #7d8788;

  --add: #2f8a47; --add-bg: #dcf1e1;
  --del: #c0392b; --del-bg: #fbe1dd;
  --chg: #b7791f; --chg-bg: #fbefd8;

  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --step--1: 0.78rem; --step-0: 0.875rem; --step-1: 1rem; --step-2: 1.25rem; --step-3: 1.6rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111718; --surface: #182022; --ink: #e2e8e5; --muted: #95a3a3; --line: #2c3739;
  --accent: #6cc3c9; --accent-soft: #1c3537;
  --decision-bg: #3a3018; --decision-line: #d9ad4b;
  --action-bg: #22283a;   --action-line: #8d9cd0;
  --data-bg: #17303b;     --data-line: #63aed1;
  --external-bg: #2d2238; --external-line: #b48ed2;
  --start-bg: #e2e8e5;    --start-ink: #111718;
  --loop: #e27fcf;        --implicit-stripe: rgba(224, 133, 102, 0.14);
  --focus: #79a6ff;
  --ok-bg: #183222;       --ok-line: #63bb78;
  --rej-bg: #3b2119;      --rej-line: #e08566;
  --err-bg: #232b2c;      --err-line: #9aa6a7;
  --add: #63c27c; --add-bg: #173323; --del: #ef7d70; --del-bg: #3d1d1a; --chg: #e2ac54; --chg-bg: #3a2e16;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111718; --surface: #182022; --ink: #e2e8e5; --muted: #95a3a3; --line: #2c3739;
  --accent: #6cc3c9; --accent-soft: #1c3537;
  --decision-bg: #3a3018; --decision-line: #d9ad4b;
  --action-bg: #22283a;   --action-line: #8d9cd0;
  --data-bg: #17303b;     --data-line: #63aed1;
  --external-bg: #2d2238; --external-line: #b48ed2;
  --start-bg: #e2e8e5;    --start-ink: #111718;
  --loop: #e27fcf;        --implicit-stripe: rgba(224, 133, 102, 0.14);
  --focus: #79a6ff;
  --ok-bg: #183222;       --ok-line: #63bb78;
  --rej-bg: #3b2119;      --rej-line: #e08566;
  --err-bg: #232b2c;      --err-line: #9aa6a7;
  --add: #63c27c; --add-bg: #173323; --del: #ef7d70; --del-bg: #3d1d1a; --chg: #e2ac54; --chg-bg: #3a2e16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: var(--step--1); }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* top bar */
.top { display: flex; align-items: baseline; gap: 6px 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; flex: none; }
.brand h1 { font-size: var(--step-2); font-weight: 700; letter-spacing: -.01em; }
.about { flex: 1 1 auto; min-width: 0; color: var(--muted); }
.stats { display: flex; gap: 14px; align-items: baseline; flex: none; font-size: var(--step--1); color: var(--muted); }
.stats b { font-family: var(--font-display); font-size: var(--step-1); color: var(--ink); font-variant-numeric: tabular-nums; }
/* One-line text that expands on click. */
.clampbox { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.clampbox .clamp-t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clampbox.open { display: block; }
.clampbox.open .clamp-t { white-space: normal; }
.clampbox.open .more-link { margin-left: 6px; }
.more-link { flex: none; border: 0; background: none; padding: 0; font: inherit; font-size: var(--step--1); font-weight: 600; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 720px) { .top { flex-wrap: wrap; } .about { flex-basis: 100%; order: 3; } }

.compare { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 12px; background: var(--chg-bg); border: 1px solid var(--chg); border-radius: 8px; }
.compare[hidden] { display: none; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); }

/* workbench */
.bench { display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; gap: 16px; margin-top: 16px; height: calc(100% - 110px); min-height: 560px; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* index */
.index { overflow: hidden; }
.index .search { padding: 10px; border-bottom: 1px solid var(--line); }
.index input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.flowlist { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.domain { padding: 10px 8px 4px; }
.flowbtn { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; width: 100%; text-align: left; padding: 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
.flowbtn:hover { background: var(--bg); }
.flowbtn[aria-current="true"] { background: var(--accent-soft); }
.flowbtn .t { font-weight: 600; min-width: 0; }
.flowbtn .s { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5; }
.pill.find { color: var(--rej-line); }
.pill.added { color: var(--add); background: var(--add-bg); }
.pill.removed { color: var(--del); background: var(--del-bg); }
.pill.changed { color: var(--chg); background: var(--chg-bg); }
.pill.high { color: var(--ok-line); }
.pill.medium { color: var(--chg); }
.pill.low { color: var(--del); }

/* flow pane */
.flow { overflow: hidden; }
.flowhead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.flowhead h2 { font-size: var(--step-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); }
.trigger { font-family: var(--font-mono); font-size: var(--step--1); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.flowhead .fsum { color: var(--ink); }
.paths { display: flex; flex-wrap: wrap; gap: 6px; }
.pathbtn .t, .linkbtn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pathbtn { max-width: 300px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: var(--step--1); }
.pathbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pathbtn.success .dot { background: var(--ok-line); }
.pathbtn.rejected .dot { background: var(--rej-line); }
.pathbtn.error .dot { background: var(--err-line); }
.pathbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.notes { display: flex; flex-direction: column; gap: 6px; max-height: 132px; overflow-y: auto; }
.note { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; text-align: left; }
.note:hover { border-color: var(--rej-line); }
.note .k { font-size: 0.68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--rej-line); }
.note.change .k { color: var(--chg); }
details.collapse > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: var(--step--1); list-style-position: inside; }

.canvaswrap { position: relative; flex: 1; min-height: 360px; overflow: hidden; background:
  radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 18px 18px, var(--surface); touch-action: none; }
.canvaswrap svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.canvaswrap svg.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 600; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 0.7rem; color: var(--muted); max-width: calc(100% - 140px); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1.5px solid; }

/* nodes (HTML inside foreignObject) */
.node { width: 100%; height: 100%; border: 1.5px solid; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; font-family: var(--font-body); font-size: 13px; line-height: 1.35; color: var(--ink); overflow: hidden; }
.node .ty { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .75; display: flex; justify-content: space-between; gap: 6px; }
.node .lb { font-weight: 500; }
.node.start { background: var(--start-bg); color: var(--start-ink); border-color: var(--start-bg); border-radius: 999px; text-align: center; justify-content: center; }
.node.decision { background: var(--decision-bg); border-color: var(--decision-line); }
.node.action { background: var(--action-bg); border-color: var(--action-line); }
.node.data { background: var(--data-bg); border-color: var(--data-line); border-radius: 8px 8px 16px 16px; }
.node.external { background: var(--external-bg); border-color: var(--external-line); border-style: dashed; }
.node.outcome.success { background: var(--ok-bg); border-color: var(--ok-line); }
.node.outcome.rejected { background: var(--rej-bg); border-color: var(--rej-line); }
.node.outcome.error { background: var(--err-bg); border-color: var(--err-line); }
.node.sel { box-shadow: 0 0 0 3px var(--focus); }
.node.hl { box-shadow: 0 0 0 4px var(--accent), 0 0 0 9px var(--accent-soft); }
.node .handoff { font-size: 11px; font-weight: 600; color: var(--external-line); }
.links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.linkbtn { max-width: 340px; display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--external-line); color: var(--ink); background: var(--external-bg); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: var(--step--1); font-weight: 600; }
.linkbtn:hover { border-style: solid; }
.linkbtn .count { font-weight: 500; opacity: .75; }
.linkmore { border: 1px dashed var(--line); background: none; color: var(--muted); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: var(--step--1); font-weight: 600; }
.linkmore:hover { color: var(--ink); border-color: var(--ink); }
.askbox { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.askform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.askform input { flex: 1 1 280px; min-width: 0; padding: 9px 12px; border: 1.5px solid var(--accent); border-radius: 8px; background: var(--surface); }
.askform .hint { flex-basis: 100%; font-size: var(--step--1); color: var(--muted); }
.answer { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.answer .text { white-space: pre-wrap; max-width: 90ch; line-height: 1.6; }
.answer .cite { display: inline; border: 0; background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 0 5px; cursor: pointer; font: inherit; font-weight: 600; }
.answer .cite:hover { text-decoration: underline; }
.answer .foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: var(--step--1); color: var(--muted); }
.node.d-added { border: 3px solid var(--add); }
.node.d-changed { border: 3px solid var(--chg); }
.node.d-removed { opacity: .75; border: 3px dashed var(--del); }
.node.d-removed .lb { text-decoration: line-through; }
.dtag { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 0 5px; border-radius: 3px; color: var(--surface); }
.dtag.stale { background: var(--rej-line); }
.dtag.added { background: var(--add); } .dtag.changed { background: var(--chg); } .dtag.removed { background: var(--del); }
.node .flagdot { color: var(--rej-line); }
g.dim { opacity: .18; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.edge.happy { stroke: var(--accent); stroke-width: 2.5; }
.edge.d-added { stroke: var(--add); stroke-width: 2.5; }
.edge.d-removed { stroke: var(--del); stroke-dasharray: 6 5; }
.elabel { pointer-events: none; }
.elabel rect { fill: var(--surface); stroke: var(--line); }
.elabel text { fill: var(--ink); font-family: var(--font-body); font-size: 11px; font-weight: 600; }
.arrow { fill: var(--muted); }
.arrow-happy { fill: var(--accent); }
.arrow-add { fill: var(--add); }
.arrow-del { fill: var(--del); }
.arrow-loop { fill: var(--loop); }
.arrow-focus { fill: var(--focus); }
.edge.focus { stroke: var(--focus); stroke-width: 3; }
.edge.focus.implicit, .edge.focus.loop, .edge.focus.par { stroke: var(--focus); stroke-width: 2.5; }
g.e.faded, g.elabel.faded { opacity: .3; }
.elabel.focus rect { stroke: var(--focus); stroke-width: 1.5; }
.elabel.focus text { fill: var(--focus); }
.arrow-imp { fill: var(--rej-line); }
.edge.loop { stroke: var(--loop); stroke-width: 2; stroke-dasharray: 7 4; }
.edge.par { stroke: var(--external-line); stroke-width: 3; }
.edge.implicit { stroke: var(--rej-line); stroke-dasharray: 3 4; stroke-width: 1.8; }
.elabel.loop rect { stroke: var(--loop); }
.elabel.loop text { fill: var(--loop); }
.elabel.implicit rect { stroke: var(--rej-line); stroke-dasharray: 3 3; }
.node.implicit { border-style: dashed; background-image: repeating-linear-gradient(135deg, transparent 0 8px, var(--implicit-stripe) 8px 10px); }
.node.stacked { box-shadow: 4px 4px 0 -1.5px var(--surface), 4px 4px 0 0 var(--external-line), 8px 8px 0 -1.5px var(--surface), 8px 8px 0 0 var(--external-line); }
.node.stacked.sel { box-shadow: 0 0 0 3px var(--focus), 4px 4px 0 -1.5px var(--surface), 4px 4px 0 0 var(--external-line), 8px 8px 0 -1.5px var(--surface), 8px 8px 0 0 var(--external-line); }
.node .flowtag { font-size: 11px; font-weight: 600; color: var(--external-line); }
.node .flowtag.join { color: var(--loop); }
.dtag.implicit { background: var(--rej-line); }
.edge.loop.focus, .edge.implicit.focus, .edge.par.focus { stroke: var(--focus); }
.elabel.loop.focus rect { stroke: var(--focus); }
.elabel.loop.focus text { fill: var(--focus); }

/* inspector */
.inspector { overflow-y: auto; padding: 16px; gap: 14px; }
.inspector h3 { font-size: var(--step-1); }
.empty { color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.rule { margin: 0; padding: 10px 12px; background: var(--bg); border-left: 3px solid var(--decision-line); border-radius: 0 6px 6px 0; }
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.before { background: var(--del-bg); border-radius: 6px; padding: 8px 10px; }
.after { background: var(--add-bg); border-radius: 6px; padding: 8px 10px; }
.before b, .after b { display: block; font-size: 0.68rem; letter-spacing: .06em; text-transform: uppercase; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: var(--step--1); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.composer { display: flex; flex-direction: column; gap: 8px; }
.act { display: flex; flex-direction: column; gap: 8px; padding: 12px; margin-block: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.act-tile { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.act-tile:hover { border-color: var(--accent); }
.act-tile .ic, .act-head .ic { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 17px; font-weight: 700; }
.act-tile .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.act-tile b { font-size: var(--step-0); }
.act-tile small, .act-head small { color: var(--muted); font-size: 0.75rem; line-height: 1.4; }
.act-tile.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.act-tile.primary .ic { background: var(--surface); color: var(--accent); }
.act-tile.primary small { color: var(--surface); opacity: .85; }
.act-tile.warn .ic { background: var(--rej-bg); color: var(--rej-line); }
.act-tile.warn:hover { border-color: var(--rej-line); }
.act.open { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.act.open.flag { border-color: var(--rej-line); box-shadow: 0 0 0 3px var(--rej-bg); }
.act-head { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.act-head div { display: flex; flex-direction: column; min-width: 0; }
.act.flag .act-head .ic { background: var(--rej-bg); color: var(--rej-line); }
.act label { font-weight: 600; font-size: var(--step--1); }
.act textarea { width: 100%; min-height: 84px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); resize: vertical; }
.act .current { font-size: var(--step--1); padding: 8px 10px; border-left: 3px solid var(--decision-line); background: var(--bg); border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 2px; }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; }
.idea { border: 1px dashed var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; cursor: pointer; }
.idea:hover { border-color: var(--accent); }
.act .next { font-size: 0.75rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.act .next b { color: var(--ink); font-size: 0.68rem; letter-spacing: .06em; text-transform: uppercase; }
.btn.big { padding: 9px 14px; font-size: var(--step-0); }
.linkish { border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: var(--step--1); }
.implicitbox { background: var(--rej-bg); border: 1.5px dashed var(--rej-line); border-radius: 6px; padding: 8px 10px; font-size: var(--step--1); }
.implicitbox b { display: block; font-size: 0.68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--rej-line); }
.pathbtn.implicit { border-style: dashed; }
.small { font-size: var(--step--1); }
.composer textarea { width: 100%; min-height: 84px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); resize: vertical; }
.cmd { font-family: var(--font-mono); font-size: 0.72rem; padding: 8px 10px; background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; overflow-wrap: anywhere; user-select: all; }
.toast { font-size: var(--step--1); color: var(--accent); font-weight: 600; min-height: 1.2em; }
.anchors { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.anchors code { font-family: var(--font-mono); font-size: 0.72rem; overflow-wrap: anywhere; }

.stalebar { margin-top: 12px; padding: 8px 12px; border: 1px solid var(--rej-line); background: var(--rej-bg); border-radius: 8px; }
.stalebox { background: var(--rej-bg); border-radius: 6px; padding: 8px 10px; }
.stalebox b { display: block; font-size: 0.68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--rej-line); }
.calls { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; counter-reset: call; }
.calls li { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 0 4px; font-size: 0.75rem; counter-increment: call; }
.calls li::before { content: counter(call) "."; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.calls .fn { font-family: var(--font-mono); overflow-wrap: break-word; }
.calls .where { grid-column: 2; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); overflow-wrap: anywhere; }
.calls .kind { font-size: 0.62rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--external-line); margin-left: 4px; }
.calls li.grp { display: block; font-size: 0.75rem; font-weight: 600; color: var(--ink); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); counter-increment: none; }
.calls li.grp:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.calls li.grp::before { content: none; }
.calls .grp-k { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.missing { max-width: 60ch; margin: 10vh auto; display: flex; flex-direction: column; gap: 10px; }

@media (max-width: 1100px) {

}

}

}

<header class="top" id="top"></header>
<div class="compare" id="compare" hidden></div>
<div class="stalebar" id="stalebar" hidden></div>
<section class="askbox" id="askbox" hidden aria-label="Ask about the business logic">
  <form class="askform" id="askform">
    <input id="askq" type="text" autocomplete="off" placeholder="Ask about any business rule, e.g. when is a refund refused?" aria-label="Question">
    <button type="submit" class="btn primary" id="askgo">Ask</button>
    <button type="button" class="btn" id="askstop" hidden>Stop</button>
    <span class="hint" id="askhint"></span>
  </form>
  <div class="answer" id="answer" hidden></div>
</section>
<main class="bench" id="bench">
  <nav class="pane index" aria-label="Flows">
    <div class="search"><input type="search" id="q" placeholder="Search flows and rules" aria-label="Search flows and rules"></div>
    <div class="flowlist" id="flowlist"></div>
  </nav>
  <section class="pane flow" aria-label="Flow">
    <div class="flowhead" id="flowhead"></div>
    <div class="canvaswrap" id="canvaswrap">
      <svg id="canvas" role="img" aria-label="Flowchart"></svg>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--decision-bg);border-color:var(--decision-line)"></i>Decision</span>
        <span><i style="background:var(--action-bg);border-color:var(--action-line)"></i>Action</span>
        <span><i style="background:var(--data-bg);border-color:var(--data-line)"></i>Data</span>
        <span><i style="background:var(--external-bg);border-color:var(--external-line)"></i>Outside system</span>
        <span><i style="background:var(--ok-bg);border-color:var(--ok-line)"></i>Success</span>
        <span><i style="background:var(--rej-bg);border-color:var(--rej-line)"></i>Rejected</span>
        <span><b style="color:var(--loop)">↺</b> Repeats</span>
        <span><b style="color:var(--external-line)">⇉</b> In parallel</span>
        <span><i style="border-style:dashed;border-color:var(--rej-line)"></i>Not handled in code</span>
      </div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="zfit" aria-label="Fit to screen">⤢</button>
      </div>
    </div>
  </section>
  <aside class="pane inspector" id="inspector" aria-label="Details"></aside>
</main>

<script>
const PAYLOAD = /*__IM_A_PM_DATA__*/null;
(function () {
  'use strict';
  if (!PAYLOAD) {
    document.getElementById('bench').innerHTML = '<div class="missing"><h2>No map loaded</h2><p>This is the viewer template. Run <code class="mono">node scripts/im-a-pm.mjs render</code> to build <code class="mono">.im-a-pm/index.html</code> from <code class="mono">.im-a-pm/flows.json</code>.</p></div>';
    return;
  }
  const { head, base, diff, served } = PAYLOAD;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TYPE_NAMES = { start: 'Trigger', decision: 'Decision', action: 'Action', data: 'Data', external: 'Outside system', outcome: 'Outcome' };
  const NODE_W = 236, GAP_X = 56, GAP_Y = 54, PAD = 40, STACK = 8;
  const FANOUT_ICON = { parallel: '⇉', batch: '▤', each: '↻' };
  const FANOUT_TEXT = { parallel: 'in parallel', batch: 'in batches', each: 'for each' };
  const JOIN_TEXT = { all: 'all of them', any: 'any one', first: 'the first' };

  const state = { flow: null, node: null, path: 'all', showChanges: !!diff, composer: null, q: '', hl: new Set() };
  let aiAsk = null; // set when the page can ask Claude
  const consumers = new Map(), emitters = new Map();
  for (const f of head.flows) {
    if (f.trigger?.channel) (consumers.get(f.trigger.channel) || consumers.set(f.trigger.channel, []).get(f.trigger.channel)).push(f);
    for (const n of f.nodes) for (const e of n.emits || []) (emitters.get(e.channel) || emitters.set(e.channel, []).get(e.channel)).push({ flow: f, node: n });
  }
  const nextFlows = (n) => (n.emits || []).flatMap((e) => consumers.get(e.channel) || []);

  document.title = `${head.app.name} business map`;

  // ------------------------------------------------------------ data helpers
  const headFlows = new Map(head.flows.map((f) => [f.id, f]));
  const baseFlows = new Map((base?.flows || []).map((f) => [f.id, f]));
  const allFlowIds = [...headFlows.keys(), ...(diff ? diff.removed : [])];

  function flowStatus(id) {
    if (!diff) return null;
    if (diff.added.includes(id)) return 'added';
    if (diff.removed.includes(id)) return 'removed';
    if (diff.changed[id]) return 'changed';
    return null;
  }
  const flowOf = (id) => headFlows.get(id) || baseFlows.get(id);
  const edgeKey = (e) => `${e.from}→${e.to}${e.label ? ` [${e.label}]` : ''}`;

  // Union of head and base when showing changes.
  function graph(id) {
    const status = flowStatus(id);
    const hf = headFlows.get(id), bf = baseFlows.get(id);
    if (!state.showChanges || !diff || (!hf && !bf)) {
      const f = hf || bf;
      return { flow: f, nodes: f.nodes.map((n) => ({ ...n, _d: null })), edges: f.edges.map((e) => ({ ...e, _d: null })) };
    }
    if (status === 'removed') return { flow: bf, nodes: bf.nodes.map((n) => ({ ...n, _d: 'removed' })), edges: bf.edges.map((e) => ({ ...e, _d: 'removed' })) };
    if (status === 'added') return { flow: hf, nodes: hf.nodes.map((n) => ({ ...n, _d: 'added' })), edges: hf.edges.map((e) => ({ ...e, _d: 'added' })) };
    const d = diff.changed[id];
    if (!d) return { flow: hf, nodes: hf.nodes.map((n) => ({ ...n, _d: null })), edges: hf.edges.map((e) => ({ ...e, _d: null })) };
    const changed = new Map(d.nodes.changed.map((c) => [c.id, c.fields]));
    const nodes = hf.nodes.map((n) => ({ ...n, _d: d.nodes.added.includes(n.id) ? 'added' : changed.has(n.id) ? 'changed' : null, _before: changed.get(n.id) }));
    for (const rid of d.nodes.removed) nodes.push({ ...bf.nodes.find((n) => n.id === rid), _d: 'removed' });
    const edges = hf.edges.map((e) => ({ ...e, _d: d.edges.added.includes(edgeKey(e)) ? 'added' : null }));
    for (const e of bf.edges) if (d.edges.removed.includes(edgeKey(e))) edges.push({ ...e, _d: 'removed' });
    return { flow: hf, nodes, edges };
  }

  function onPath(g, outcomeId, withLoops = true) {
    const out = new Map(g.nodes.map((n) => [n.id, []]));
    const inn = new Map(g.nodes.map((n) => [n.id, []]));
    for (const e of g.edges) { if (e._d === 'removed' || e.loop) continue; out.get(e.from)?.push(e.to); inn.get(e.to)?.push(e.from); }
    const walk = (startId, adj) => { const seen = new Set([startId]); const st = [startId]; while (st.length) for (const x of adj.get(st.pop()) || []) if (!seen.has(x)) { seen.add(x); st.push(x); } return seen; };
    const fwd = walk('start', out), back = walk(outcomeId, inn);
    const on = new Set([...fwd].filter((x) => back.has(x)));
    // include the body of loops that start on this path
    // Include a loop's steps only when this outcome is reached by leaving the loop.
    if (withLoops) for (const e of g.edges) if (e.loop && e._d !== 'removed' && on.has(e.to)) {
      const body = walk(e.to, out), toSrc = walk(e.from, inn), inBody = [...body].filter((x) => toSrc.has(x));
      if ((inn.get(outcomeId) || []).some((p) => inBody.includes(p))) inBody.forEach((x) => on.add(x));
    }
    return on;
  }

  // ------------------------------------------------------------ layout
  const measurer = document.createElement('div');
  measurer.style.cssText = `position:absolute;left:-9999px;top:0;width:${NODE_W}px;visibility:hidden`;
  document.body.appendChild(measurer);

  function nodeHtml(n, flow) {
    const findings = (flow.findings || []).filter((f) => (f.nodes || []).includes(n.id)).length;
    const cls = ['node', n.type, n.type === 'outcome' ? n.result : '', n._d ? `d-${n._d}` : '', state.node === n.id ? 'sel' : '', state.hl.has(n.id) ? 'hl' : '', n.implicit ? 'implicit' : '', n._stacked ? 'stacked' : ''].join(' ');
    const sub = n.type === 'outcome' && n.response ? `<span class="mono" style="font-size:11px;opacity:.8">${esc(n.response)}</span>` : n.type === 'external' && n.system ? `<span style="font-size:11px;opacity:.8">${esc(n.system)}</span>` : '';
    const ty = n.type === 'start' ? '' : `<div class="ty"><span>${TYPE_NAMES[n.type]}${n.type === 'data' && n.data ? ` · ${esc(n.data.op)}` : ''}</span>${n._d ? `<span class="dtag ${n._d}">${n._d === 'added' ? 'new' : n._d}</span>` : n.stale ? '<span class="dtag stale">re-check</span>' : n.implicit ? '<span class="dtag implicit">not in code</span>' : findings ? '<span class="flagdot">● finding</span>' : ''}</div>`;
    const flowTag = n.fanout ? `<div class="flowtag fan">${FANOUT_ICON[n.fanout.mode] || '⇉'} ${esc(FANOUT_TEXT[n.fanout.mode] || n.fanout.mode)}: ${esc(n.fanout.over)}</div>`
      : n.join ? `<div class="flowtag join">⇶ waits for ${esc(JOIN_TEXT[n.join.mode] || n.join.mode)}</div>` : '';
    const nx = nextFlows(n);
    const ho = nx.length ? `<div class="handoff">↳ continues in ${nx.map((f) => esc(f.title)).join(', ')}</div>` : (n.emits || []).length ? `<div class="handoff">↳ ${n.emits.map((e) => esc(e.channel)).join(', ')}</div>` : '';
    return `<div class="${cls}" xmlns="http://www.w3.org/1999/xhtml">${ty}<div class="lb">${esc(n.label)}</div>${sub}${flowTag}${ho}</div>`;
  }

  function layout(g) {
    const ids = g.nodes.map((n) => n.id);
    const out = new Map(ids.map((i) => [i, []])), indeg = new Map(ids.map((i) => [i, 0])), parents = new Map(ids.map((i) => [i, []]));
    for (const e of g.edges) { if (e.loop || !out.has(e.from) || !out.has(e.to)) continue; out.get(e.from).push(e.to); indeg.set(e.to, indeg.get(e.to) + 1); parents.get(e.to).push(e.from); }
    const layer = new Map(); const q = ids.filter((i) => indeg.get(i) === 0); q.forEach((i) => layer.set(i, 0));
    const deg = new Map(indeg); const order = [];
    while (q.length) { const x = q.shift(); order.push(x); for (const y of out.get(x)) { layer.set(y, Math.max(layer.get(y) ?? 0, layer.get(x) + 1)); deg.set(y, deg.get(y) - 1); if (deg.get(y) === 0) q.push(y); } }
    for (const i of ids) if (!layer.has(i)) layer.set(i, 0);

    const byId = new Map(g.nodes.map((n) => [n.id, n]));
    // The main column is the happy path. When the happy outcome is the exit of a loop (a batch
    // loop: "any left? no → done"), the loop body is the main work and the outcome becomes a side exit.
    const happy = onPath(g, g.flow.happyPath, false);
    let happyExit = null;
    const reachOut = (from) => { const seen = new Set([from]); const st = [from]; while (st.length) for (const y of out.get(st.pop()) || []) if (!seen.has(y)) { seen.add(y); st.push(y); } return seen; };
    const reachIn = (from) => { const seen = new Set([from]); const st = [from]; while (st.length) for (const y of parents.get(st.pop()) || []) if (!seen.has(y)) { seen.add(y); st.push(y); } return seen; };
    for (const e of g.edges) if (e.loop && happy.has(e.to) && out.has(e.from)) {
      const body = [...reachOut(e.to)].filter((x) => reachIn(e.from).has(x));
      if ((parents.get(g.flow.happyPath) || []).some((p) => body.includes(p))) { body.forEach((x) => happy.add(x)); happy.delete(g.flow.happyPath); happyExit = g.flow.happyPath; }
    }
    // Steps inside a parallel or for-each split (up to its join) are drawn as a stack.
    for (const n of g.nodes) n._stacked = false;
    for (const n of g.nodes) if (n.fanout && n.fanout.mode !== 'batch') {
      const st = [...(out.get(n.id) || [])];
      while (st.length) { const x = st.pop(); const m = byId.get(x); if (!m || m._stacked || m.join || m.type === 'outcome') continue; m._stacked = true; st.push(...(out.get(x) || [])); }
    }
    // A dead-end outcome off a single decision is a side exit: same row as the decision, to its right.
    const side = new Set(ids.filter((i) => byId.get(i).type === 'outcome' && !happy.has(i) && parents.get(i).length === 1));
    for (const i of side) layer.set(i, layer.get(parents.get(i)[0]));
    const layers = [];
    for (const i of ids) (layers[layer.get(i)] ||= []).push(i);
    const col = new Map();
    for (let k = 0; k < layers.length; k++) {
      let L = layers[k];
      if (!L) continue;
      const bary = (i) => { const p = parents.get(i).filter((x) => col.has(x)); return p.length ? p.reduce((s, x) => s + col.get(x), 0) / p.length : 0; };
      L.sort((a, b) => (side.has(a) - side.has(b)) || (happy.has(b) - happy.has(a)) || (bary(a) - bary(b)) || (ids.indexOf(a) - ids.indexOf(b)));
      // Happy-path step in column 0, the other steps in the next free columns.
      const used = new Set();
      const place = (i) => {
        let want = happy.has(i) ? 0 : Math.max(1, Math.round(bary(i)));
        while (used.has(want)) want++;
        used.add(want); col.set(i, want);
      };
      L.filter((i) => !side.has(i) && happy.has(i)).forEach(place);
      L.filter((i) => !side.has(i) && !happy.has(i)).forEach(place);
      // A decision's exits stack in the column right of it, but only when nothing else sits to
      // its right in this row. Otherwise they move down a row, where they get a free column.
      const mainCols = L.filter((i) => !side.has(i)).map((i) => col.get(i));
      const groups = new Map();
      for (const i of L.filter((x) => side.has(x))) { const p = parents.get(i)[0]; (groups.get(p) || groups.set(p, []).get(p)).push(i); }
      const moved = new Set();
      for (const [p, list] of groups) {
        const pc = col.get(p);
        if (pc !== undefined && !mainCols.some((c) => c > pc)) list.forEach((i) => col.set(i, pc + 1));
        else list.forEach((i) => { side.delete(i); layer.set(i, k + 1); (layers[k + 1] ||= []).push(i); moved.add(i); });
      }
      if (moved.size) layers[k] = L.filter((i) => !moved.has(i));
    }

    const heights = new Map();
    for (const n of g.nodes) { measurer.innerHTML = nodeHtml(n, g.flow); heights.set(n.id, Math.max(n.type === 'start' ? 44 : 56, measurer.firstChild.offsetHeight)); }
    // Labels on arrows between steps in the same row sit in the column gap: make it wide enough.
    const labelW = (t) => Math.max(28, String(t).length * 6.6 + 14);
    const gapX = Math.min(150, Math.max(GAP_X, ...g.edges.filter((e) => !e.loop && e.label && layer.get(e.from) === layer.get(e.to)).map((e) => labelW(e.label) + 24)));
    const loops = g.edges.filter((e) => e.loop && byId.has(e.from) && byId.has(e.to)).length;
    const left = PAD + (loops ? 34 + loops * 16 : 0);
    const pos = new Map(); let y = PAD, maxCol = 0;
    layers.forEach((L) => {
      if (!L) return;
      const hOf = (i) => heights.get(i) + (byId.get(i)._stacked ? STACK : 0);
      const main = L.filter((i) => !side.has(i));
      const mainH = main.length ? Math.max(...main.map(hOf)) : 0;
      const stacks = new Map();
      for (const i of L.filter((i) => side.has(i))) { const k = parents.get(i)[0]; (stacks.get(k) || stacks.set(k, []).get(k)).push(i); }
      const stackH = (list) => list.reduce((t, i) => t + heights.get(i), 0) + (list.length - 1) * 12;
      const h = Math.max(mainH, ...[...stacks.values()].map(stackH));
      for (const i of main) pos.set(i, { x: left + col.get(i) * (NODE_W + gapX), y: y + (mainH - heights.get(i)) / 2, w: NODE_W, h: heights.get(i), row: y, rowH: h, col: col.get(i) });
      for (const list of stacks.values()) {
        let sy = y + Math.max(0, (mainH - heights.get(list[0])) / 2);
        for (const i of list) { pos.set(i, { x: left + col.get(i) * (NODE_W + gapX), y: sy, w: NODE_W, h: heights.get(i), row: y, rowH: h, col: col.get(i) }); sy += heights.get(i) + 12; }
      }
      for (const i of L) maxCol = Math.max(maxCol, col.get(i));
      y += h + GAP_Y;
    });
    if (happyExit) happy.add(happyExit);
    return { pos, left, gapX, width: left + PAD + (maxCol + 1) * NODE_W + maxCol * gapX + STACK, height: y - GAP_Y + PAD + 40, happy };
  }

  // ------------------------------------------------------------ canvas
  const svg = $('canvas');
  let view = { x: 0, y: 0, w: 800, h: 600 }, content = { width: 800, height: 600 };
  const setView = () => svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  // Fit the width at a readable size (between 80% and 100%), anchored to the top-left; taller or wider flows pan.
  function fit() {
    const r = svg.getBoundingClientRect(); const cw = r.width || 800, ch = r.height || 600;
    // Readable first: never below 80%. Wider flows pan sideways.
    const scale = Math.max(Math.min(0.8, 1), Math.min(1, cw / content.width));
    const w = cw / scale, h = ch / scale;
    view = { x: w >= content.width ? (content.width - w) / 2 : 0, y: 0, w, h }; setView();
  }
  function zoom(f, cx, cy) {
    const nw = Math.min(Math.max(view.w * f, 200), 8000), k = nw / view.w;
    cx ??= view.x + view.w / 2; cy ??= view.y + view.h / 2;
    view = { x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k, w: nw, h: view.h * k }; setView();
  }
  $('zin').onclick = () => zoom(0.8); $('zout').onclick = () => zoom(1.25); $('zfit').onclick = fit;
  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    if (!(ev.ctrlKey || ev.metaKey)) { view.x += ev.deltaX * view.w / r.width; view.y += ev.deltaY * view.h / r.height; setView(); return; }
    zoom(ev.deltaY > 0 ? 1.1 : 0.9, view.x + (ev.clientX - r.left) / r.width * view.w, view.y + (ev.clientY - r.top) / r.height * view.h);
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', (ev) => { if (ev.target.closest('.node')) return; drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false }; svg.classList.add('dragging'); svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener('pointermove', (ev) => { if (!drag) return; if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 3) drag.moved = true; const r = svg.getBoundingClientRect(); view.x = drag.vx - (ev.clientX - drag.x) * view.w / r.width; view.y = drag.vy - (ev.clientY - drag.y) * view.h / r.height; setView(); });
  const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
  // A click (not a drag) on empty canvas clears the selection.
  svg.addEventListener('pointerup', () => { const clicked = drag && !drag.moved; endDrag(); if (clicked && state.node) { state.node = null; state.composer = null; drawCanvas(false); drawInspector(); } });
  svg.addEventListener('pointercancel', endDrag);

  let lastPos = new Map();
  // Pan so a step is in view (after a click from a list, a finding or an AI citation).
  function reveal(id) {
    const p = lastPos.get(id); if (!p) return;
    if (p.y < view.y || p.y + p.h > view.y + view.h || p.x < view.x || p.x + p.w > view.x + view.w) {
      view.y = Math.max(0, p.y - view.h * 0.3);
      if (p.x < view.x || p.x + p.w > view.x + view.w) view.x = Math.max(Math.min(0, view.x), p.x + p.w / 2 - view.w / 2);
      setView();
    }
  }
  function drawCanvas(refit) {
    const g = graph(state.flow); const L = layout(g); lastPos = L.pos;
    content = { width: L.width, height: L.height };
    const hl = state.path === 'all' ? null : onPath(g, state.path);
    const parts = [`<defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-happy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-happy" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-add" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-add" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-del" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-del" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-loop" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-imp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-imp" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow-focus" d="M0,0 L10,5 L0,10 z"/></marker></defs>`];
    const labels = [];
    const byId = new Map(g.nodes.map((n) => [n.id, n]));
    const focus = state.node && byId.has(state.node) ? state.node : null;
    const touches = (e) => !!focus && (e.from === focus || e.to === focus);
    const fade = (e) => (focus && !touches(e) ? ' faded' : '');
    const gone = (id) => ['added', 'removed'].includes(byId.get(id)?._d);
    // A removed path between two steps that still exist is a re-route; the new steps show it.
    const visible = g.edges.filter((e) => L.pos.get(e.from) && L.pos.get(e.to) && !(e._d === 'removed' && !gone(e.from) && !gone(e.to)));
    const sameRow = (e) => L.pos.get(e.from).row === L.pos.get(e.to).row;

    // Which grid cells hold a step, so routes can avoid them.
    const cells = new Map();
    for (const [id, p] of L.pos) cells.set(`${p.row}|${p.col}`, id);
    const rows = [...new Set([...L.pos.values()].map((p) => p.row))].sort((x, y) => x - y);
    const free = (row, col, ignore = []) => { const id = cells.get(`${row}|${col}`); return !id || ignore.includes(id); };
    const between = (a, b) => rows.filter((r) => r > Math.min(a.row, b.row) && r < Math.max(a.row, b.row));
    const span = (from, to) => { const out = []; for (let c = Math.min(from, to); c <= Math.max(from, to); c++) out.push(c); return out; };

    // How each arrow leaves its source and enters its target. A fork keeps its straight-down
    // branch on the bottom and sends the others out of the side; a merge keeps the arrow from
    // above on the top and brings the others in from the side, as in a hand-drawn flowchart.
    const mode = new Map();
    for (const e of visible) {
      if (e.loop || sameRow(e)) continue;
      const a = L.pos.get(e.from), b = L.pos.get(e.to);
      let out = 'bottom', inn = 'top';
      if (a.col !== b.col) {
        const dir = b.col > a.col ? 1 : -1;
        const forkDown = visible.some((x) => x !== e && !x.loop && x.from === e.from && !sameRow(x) && L.pos.get(x.to).col === a.col);
        const mergeDown = visible.some((x) => x !== e && !x.loop && x.to === e.to && !sameRow(x) && L.pos.get(x.from).col === b.col);
        const sideOutClear = span(a.col + dir, b.col).every((c) => free(a.row, c)) && between(a, b).every((r) => free(r, b.col));
        const sideInClear = span(a.col, b.col - dir).every((c) => free(b.row, c, [e.from])) && between(a, b).every((r) => free(r, a.col));
        if (forkDown && sideOutClear) out = 'side';
        else if (mergeDown && sideInClear) inn = 'side';
      }
      // Same column but a step in between: the arrow detours left (first column) or right.
      const detour = a.col === b.col && !between(a, b).every((r) => free(r, a.col)) ? (a.col === 0 ? -1 : 1) : 0;
      mode.set(e, { out, inn, detour });
    }
    // Arrows that still share the bottom of a step (or the top of one) get their own x,
    // ordered left to right, so every line can be followed.
    const STEP = 26;
    const exitX = new Map(), entryX = new Map(), exitRank = new Map();
    const spread = (nodeId, list, otherEnd, outMap) => {
      const p = L.pos.get(nodeId), cx = p.x + p.w / 2;
      const o = (e) => L.pos.get(e[otherEnd]);
      const by = (a, b) => o(a).x - o(b).x || o(a).y - o(b).y;
      const left = list.filter((e) => o(e).col < p.col).sort(by);
      // Within the same column, arrows that will detour left leave from the left, and so on.
      const same = list.filter((e) => o(e).col === p.col).sort((a, b) => (mode.get(a)?.detour || 0) - (mode.get(b)?.detour || 0) || by(a, b));
      const right = list.filter((e) => o(e).col > p.col).sort(by);
      const ordered = [...left, ...same, ...right];
      // The arrow that goes straight up or down keeps the middle; the others spread to its sides.
      const straight = same.findIndex((e) => !mode.get(e)?.detour);
      const ci = same.length ? left.length + Math.max(0, straight) : (ordered.length - 1) / 2;
      ordered.forEach((e, i) => { outMap.set(e, cx + (i - ci) * STEP); if (outMap === exitX) exitRank.set(e, i - ci); });
    };
    for (const n of g.nodes) {
      if (!L.pos.get(n.id)) continue;
      spread(n.id, visible.filter((e) => mode.get(e)?.out === 'bottom' && e.from === n.id), 'to', exitX);
      spread(n.id, visible.filter((e) => mode.get(e)?.inn === 'top' && e.to === n.id), 'from', entryX);
    }

    let loopNo = 0;
    for (const e of visible) {
      const a = L.pos.get(e.from), b = L.pos.get(e.to);
      const dim = hl && !(hl.has(e.from) && hl.has(e.to)) ? ' dim' : '';
      const foc = touches(e) ? ' focus' : '';
      if (e.loop) {
        // Leave from the bottom, run left through the gap between rows, up the gutter, then into the target.
        const gx = L.left - 22 - loopNo++ * 16, sx = a.x + a.w / 2, sy = a.y + a.h, gy = a.row + a.rowH + GAP_Y / 2 - 6;
        const ty = b.col === 0 ? b.y + b.h / 2 : b.row - GAP_Y / 2 + 6;
        const d = b.col === 0
          ? `M${sx},${sy} V${gy} H${gx} V${ty} H${b.x - 2}`
          : `M${sx},${sy} V${gy} H${gx} V${ty} H${b.x + b.w / 2} V${b.y - 2}`;
        const cls = ['edge', 'loop', e._d ? `d-${e._d}` : ''].join(' ') + foc;
        parts.push(`<g class="e${dim}${fade(e)}"><path class="${cls}" d="${d}" marker-end="url(#${foc ? 'ah-focus' : e._d === 'added' ? 'ah-add' : e._d === 'removed' ? 'ah-del' : 'ah-loop'})"/></g>`);
        const text = `↺ ${e.label || 'repeat'}`;
        labels.push({ cx: gx + 6 + Math.max(28, text.length * 6.6 + 14) / 2, cy: gy, text, cls: `loop${dim}${fade(e)}${foc}` });
        continue;
      }
      const happyEdge = L.happy.has(e.from) && L.happy.has(e.to) && e._d !== 'removed';
      const lw = Math.max(28, String(e.label || '').length * 6.6 + 14);
      let d, lx, ly;
      if (sameRow(e)) {
        // A decision's exit in the same row: from its right side into the exit's left side.
        const sy = a.y + a.h / 2, ty = b.y + b.h / 2, sx = a.x + a.w, tx = b.x - 2;
        d = Math.abs(sy - ty) < 1 ? `M${sx},${sy} L${tx},${ty}` : `M${sx},${sy} C${(sx + tx) / 2},${sy} ${(sx + tx) / 2},${ty} ${tx},${ty}`;
        lx = (sx + tx) / 2; ly = Math.abs(sy - ty) < 1 ? sy : (sy + ty) / 2;
      } else {
        const m = mode.get(e), dir = b.col > a.col ? 1 : b.col < a.col ? -1 : 0;
        const y1 = a.y + a.h, y2 = b.y - 2;
        if (m.out === 'side') {
          // Out of the side, across, then down into the target.
          const sx = dir > 0 ? a.x + a.w : a.x, sy = a.y + a.h / 2, en = entryX.get(e);
          d = `M${sx},${sy} H${en} V${y2}`; lx = sx + dir * (lw / 2 + 6); ly = sy;
        } else if (m.inn === 'side') {
          // Down from the source, then into the side of the target.
          const ex = exitX.get(e), ty = b.y + b.h / 2, tx = dir > 0 ? b.x - 2 : b.x + b.w + 2;
          d = `M${ex},${y1} V${ty} H${tx}`; lx = ex; ly = y1 + GAP_Y / 2 - 2;
        } else {
          const ex = exitX.get(e), en = entryX.get(e);
          // Each arrow of a fork runs on its own horizontal track inside the gap.
          const gy1 = a.row + a.rowH + GAP_Y / 2 + (exitRank.get(e) || 0) * 10, gy2 = b.row - GAP_Y / 2;
          // Labels sit where the arrow leaves its step, so crossing branches keep their labels apart.
          const near = (dirX) => ex + dirX * (lw / 2 + 10);
          const clearColumn = a.col === b.col && between(a, b).every((r) => free(r, a.col));
          const adjacent = Math.abs(a.row + a.rowH + GAP_Y - b.row) < 2;
          if (a.col === b.col && Math.abs(ex - en) < 1 && clearColumn) { d = `M${ex},${y1} V${y2}`; lx = ex; ly = y1 + GAP_Y / 2 - 2; }
          else if (adjacent || clearColumn) { d = `M${ex},${y1} V${gy1} H${en} V${y2}`; lx = Math.abs(en - ex) > lw + 20 ? near(en > ex ? 1 : -1) : (ex + en) / 2; ly = gy1; }
          else {
            // Skipping rows: along the column gap, so the arrow never crosses a step.
            // In the first column the empty left side is the clearest channel.
            const side = dir === 0 ? (a.col === 0 ? -1 : 1) : dir;
            const chX = side > 0 ? a.x + a.w + L.gapX / 2 : a.col === 0 ? a.x - 16 : a.x - L.gapX / 2;
            d = `M${ex},${y1} V${gy1} H${chX} V${gy2} H${en} V${y2}`; lx = Math.abs(chX - ex) > lw + 20 ? near(chX > ex ? 1 : -1) : (ex + chX) / 2; ly = gy1;
          }
        }
      }
      const fan = byId.get(e.from)?.fanout;
      const par = !!fan && fan.mode !== 'batch';
      const cls = ['edge', happyEdge && !e._d && !e.implicit ? 'happy' : '', par ? 'par' : '', e.implicit ? 'implicit' : '', e._d ? `d-${e._d}` : ''].join(' ') + foc;
      const mk = foc ? 'ah-focus' : e._d === 'added' ? 'ah-add' : e._d === 'removed' ? 'ah-del' : e.implicit ? 'ah-imp' : happyEdge ? 'ah-happy' : 'ah';
      parts.push(`<g class="e${dim}${fade(e)}"><path class="${cls}" d="${d}" marker-end="url(#${mk})"/></g>`);
      if (e.label) labels.push({ cx: lx, cy: ly, text: e.label, cls: `${e.implicit ? 'implicit' : ''}${dim}${fade(e)}${foc}` });
    }
    for (const n of g.nodes) {
      const p = L.pos.get(n.id); const dim = hl && !hl.has(n.id) ? ' dim' : '';
      const k = n._stacked ? STACK : 0;
      const inner = k ? nodeHtml(n, g.flow).replace('xmlns=', `style="width:${p.w}px;height:${p.h}px" xmlns=`) : nodeHtml(n, g.flow);
      parts.push(`<g class="n${dim}" data-id="${esc(n.id)}"><foreignObject x="${p.x}" y="${p.y}" width="${p.w + k}" height="${p.h + k}">${inner}</foreignObject></g>`);
    }
    // Labels never cover a step or another label: try the spot on the arrow, then nearby spots.
    const boxes = g.nodes.map((n) => L.pos.get(n.id)).filter(Boolean).map((p) => ({ x: p.x - 3, y: p.y - 3, w: p.w + 6 + (STACK), h: p.h + 6 }));
    const placed = [];
    const hit = (r) => [...boxes, ...placed].some((o) => r.x < o.x + o.w && o.x < r.x + r.w && r.y < o.y + o.h && o.y < r.y + r.h);
    // Focused labels are placed first, so they keep the best spots.
    labels.sort((a, b) => (b.cls.includes('focus') - a.cls.includes('focus')));
    for (const l of labels) {
      const w = Math.max(28, String(l.text).length * 6.6 + 14);
      const tries = [[0, 0], [0, -14], [0, 14], [w / 2 + 6, 0], [-w / 2 - 6, 0], [0, -26], [0, 26], [w / 2 + 6, -14], [-w / 2 - 6, -14]];
      let r = null;
      for (const [dx, dy] of tries) { const c = { x: l.cx + dx - w / 2, y: l.cy + dy - 10, w, h: 20 }; if (!hit(c)) { r = c; break; } }
      r ||= { x: l.cx - w / 2, y: l.cy - 10, w, h: 20 };
      placed.push({ ...r, text: l.text, cls: l.cls });
    }
    svg.innerHTML = parts.join('') + placed.map((l) => `<g class="elabel ${l.cls}" transform="translate(${l.x},${l.y})"><rect width="${l.w}" height="20" rx="10"/><text x="${l.w / 2}" y="14" text-anchor="middle">${esc(l.text)}</text></g>`).join('');
    svg.querySelectorAll('g.n').forEach((el) => el.addEventListener('click', () => { state.node = el.dataset.id; state.composer = null; drawCanvas(false); reveal(state.node); drawInspector(); }));
    if (refit) fit(); else setView();
  }

  // ------------------------------------------------------------ header & index
  function drawTop() {
    const decisions = head.flows.reduce((s, f) => s + f.nodes.filter((n) => n.type === 'decision').length, 0);
    const findings = head.flows.reduce((s, f) => s + (f.findings || []).length, 0);
    // One line: name, version, description (click to read it all), counts.
    $('top').innerHTML = `<div class="brand"><h1>${esc(head.app.name)}</h1><span class="eyebrow">${esc(head.app.ref || '')}${head.app.commit ? ' @ ' + esc(head.app.commit.slice(0, 7)) : ''}</span></div>
      ${head.app.summary ? clampHtml('about', 'about', head.app.summary, state.aboutOpen) : '<span class="about"></span>'}
      <div class="stats"><span><b>${head.flows.length}</b> entrypoints</span><span><b>${decisions}</b> decisions</span><span><b>${findings}</b> findings</span></div>`;
    clampable($('about'), () => { state.aboutOpen = !state.aboutOpen; drawTop(); });
    const stale = head.flows.flatMap((f) => f.nodes.filter((n) => n.stale).map((n) => f.title));
    if (stale.length) {
      $('stalebar').hidden = false;
      $('stalebar').innerHTML = `<b>${stale.length} step${stale.length > 1 ? 's' : ''} need${stale.length > 1 ? '' : 's'} re-checking</b> in ${[...new Set(stale)].map(esc).join(', ')}: the code behind them changed and they have not been re-checked yet. Run <span class="mono">/im-a-pm sync</span> in your coding agent to finish.`;
    }
    if (diff) {
      const n = diff.added.length + diff.removed.length + Object.keys(diff.changed).length;
      $('compare').hidden = false;
      $('compare').innerHTML = `<label class="switch"><input type="checkbox" id="showchg" ${state.showChanges ? 'checked' : ''}> Show changes</label>
        <span>Compared with <span class="mono">${esc(base.app.ref || 'base')}${base.app.commit ? ' @ ' + esc(base.app.commit.slice(0, 7)) : ''}</span>: ${n ? `<b>${n}</b> flow${n > 1 ? 's' : ''} with different business behavior` : 'no business behavior changed'}.</span>
        <span class="pill added">added</span><span class="pill changed">changed</span><span class="pill removed">removed</span>`;
      $('showchg').onchange = (ev) => { state.showChanges = ev.target.checked; state.node = null; drawAll(true); };
    }
  }

  function matches(f) {
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return [f.title, f.summary, f.trigger?.signature, ...f.nodes.flatMap((n) => [n.label, n.rule])].some((s) => (s || '').toLowerCase().includes(q));
  }
  function drawIndex() {
    const groups = new Map();
    for (const id of allFlowIds) { const f = flowOf(id); if (!matches(f)) continue; const d = f.domain || 'Other'; (groups.get(d) || groups.set(d, []).get(d)).push(f); }
    const html = [];
    for (const [d, flows] of groups) {
      html.push(`<div class="domain eyebrow">${esc(d)}</div>`);
      for (const f of flows) {
        const st = state.showChanges ? flowStatus(f.id) : null; const nf = (f.findings || []).length;
        html.push(`<button type="button" class="flowbtn" data-id="${esc(f.id)}" aria-current="${state.flow === f.id}"><span class="t">${esc(f.title)}</span>
          <span>${st ? `<span class="pill ${st}">${st}</span>` : nf ? `<span class="pill find" title="${nf} finding(s)">${nf}</span>` : ''}</span><span class="s">${esc(f.trigger?.signature || '')}</span></button>`);
      }
    }
    $('flowlist').innerHTML = html.join('') || '<p class="muted" style="padding:10px">No flow matches that search.</p>';
    $('flowlist').querySelectorAll('.flowbtn').forEach((b) => b.addEventListener('click', () => select(b.dataset.id)));
  }
  $('q').addEventListener('input', (ev) => { state.q = ev.target.value.trim(); drawIndex(); });

  function changeSentences(id) {
    const st = flowStatus(id); if (!st) return [];
    if (st === 'added') return ['This flow is new.'];
    if (st === 'removed') return ['This flow no longer exists.'];
    const d = diff.changed[id], hf = headFlows.get(id), bf = baseFlows.get(id), out = [];
    const lbl = (f, nid) => f.nodes.find((n) => n.id === nid)?.label || nid;
    for (const n of d.nodes.added) out.push(`New step: “${lbl(hf, n)}”`);
    for (const n of d.nodes.removed) out.push(`Removed step: “${lbl(bf, n)}”`);
    for (const c of d.nodes.changed) {
      if (c.fields.rule) out.push(`Rule changed in “${lbl(hf, c.id)}”`);
      else if (c.fields.label) out.push(`Reworded: “${c.fields.label[0]}” → “${c.fields.label[1]}”`);
      else out.push(`Changed: “${lbl(hf, c.id)}”`);
    }
    for (const nid of d.nodes.implChanged || []) out.push(`Code path changed in “${lbl(hf, nid)}”, same business rule`);
    if (!out.length && (d.edges.added.length || d.edges.removed.length)) out.push('The order of steps changed.');
    for (const [k, [a, b]] of Object.entries(d.fields)) out.push(`${k}: “${a ?? '—'}” → “${b ?? '—'}”`);
    return out;
  }

  // "Starts when": the steps of other flows that hand off to this one. Many flows can feed one
  // (a saga that reacts to every report update), so the row starts as one chip per flow, on one line.
  function startsWhenHtml(f) {
    if (!f.trigger?.channel) return '';
    const em = emitters.get(f.trigger.channel) || [];
    if (!em.length) return `<div class="links"><span class="muted">Starts when</span><span class="mono">${esc(f.trigger.channel)}</span> <span class="muted">arrives from outside this app</span></div>`;
    const chip = (flowId, nodeIds, text, tip, opt) => `<button type="button" class="linkbtn" data-goflow="${esc(flowId)}" data-gonode="${esc(nodeIds.join(','))}" title="${esc(tip)}"${opt ? ' data-fit="opt"' : ''}>↰ <span class="t">${text}</span></button>`;
    if (state.startsOpen) {
      const all = em.map((x) => chip(x.flow.id, [x.node.id], `${esc(x.flow.title)}: ${esc(x.node.label)}`, `${x.flow.title}: ${x.node.label}`, false)).join('');
      return `<div class="links"><span class="muted">Starts when</span>${all}<button type="button" class="linkmore" data-starts="less">Show less</button></div>`;
    }
    const groups = new Map();
    for (const x of em) (groups.get(x.flow.id) || groups.set(x.flow.id, { flow: x.flow, nodes: [] }).get(x.flow.id)).nodes.push(x.node);
    const list = [...groups.values()];
    const chips = list.map((gr, k) => chip(gr.flow.id, gr.nodes.map((n) => n.id),
      `${esc(gr.flow.title)}${gr.nodes.length > 1 ? ` <span class="count">· ${gr.nodes.length} steps</span>` : ''}`,
      `${gr.flow.title}\n${gr.nodes.map((n) => '· ' + n.label).join('\n')}`, k > 0)).join('');
    const showAll = em.length > list.length;
    return `<div class="links" data-fitrow="starts" data-total="${em.length}" data-showall="${showAll}"><span class="muted">Starts when</span>${chips}<button type="button" class="linkmore" data-starts="more" data-fitmore${showAll ? '' : ' hidden'}>show all ${em.length} steps</button></div>`;
  }
  // Keep a row of chips on one line: hide optional chips from the end until it fits, and say how
  // many are hidden on the row's "more" button.
  function fitRow(row, label) {
    if (!row) return;
    const more = row.querySelector('[data-fitmore]');
    const opt = [...row.querySelectorAll('[data-fit="opt"]')];

  (async () => {

      out.innerHTML = '<div class="text muted">Thinking…</div>';
      try {
        const { text, truncated } = await sample(`${ASK_RULES(map)}\n\nQuestion: ${question}`, {
          signal: ctl.signal, tools, onText: ({ text }) => renderAnswer(text, false),
        });
        const refs = renderAnswer(text, true);
        if (truncated) out.insertAdjacentHTML('beforeend', '<div class="foot">The answer was cut short. Ask a narrower question.</div>');
        const first = refs[0]?.split('/')[0];
        if (first) select(first, false, refs.filter((r) => r.startsWith(first + '/')).map((r) => r.split('/')[1]));
      } catch (e) {
        if (e?.code === 'cancelled') { if (e.text) renderAnswer(e.text, true); else out.hidden = true; }
        else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) { box.hidden = true; }
        else {
          if (e?.text) renderAnswer(e.text, true); else out.innerHTML = '';
          const copy = { rate_limited: 'Too many questions right now. Try again in a minute.', session_expired: 'Your session expired. Sign in again, then ask.', refused: 'Claude declined that question. Try rephrasing it.', prompt_too_large: 'This map is too large to ask about in one go.', tools_unavailable: 'This view cannot look up functions. Ask about business rules instead.' }[e?.code] || 'Something went wrong while answering. Try again.';
          out.insertAdjacentHTML('beforeend', `<div class="foot">${esc(copy)}</div>`);
        }
      } finally { go.disabled = false; stop.hidden = true; ctl = null; }
    });
  })();

  // Served by `im-a-pm view|render|sync`: reload when the map is rendered again.
  if (served) {
    let known = null;
    const poll = async () => {
      try {
        const r = await fetch('/api/version', { cache: 'no-store' });
        const { version } = await r.json();
        if (known === null) known = version;
        else if (version !== known) { location.reload(); return; }
      } catch { /* server stopped; keep the page as it is */ }
      setTimeout(poll, 1500);
    };
    poll();
  }

  drawTop();
  const initial = location.hash.slice(1);
  const firstChanged = diff ? [...diff.added, ...Object.keys(diff.changed), ...diff.removed][0] : null;
  select(flowOf(initial) ? initial : firstChanged || allFlowIds[0], true);
})();
</script>
